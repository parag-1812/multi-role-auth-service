# ============================================================
# PostgreSQL profile for auth-service.
# Activate with: SPRING_PROFILES_ACTIVE=postgres
#            or: --spring.profiles.active=postgres
#
# Database-per-service: this service OWNS `auth_db` and no other
# service connects to it.
# ============================================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:auth_db}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.h2.console.enabled=false
