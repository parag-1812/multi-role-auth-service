server.port=8081
spring.application.name=auth-service

# ============================================================
# Default (dev) profile: in-memory H2 so the service boots
# with zero external dependencies. Use the `postgres` profile
# for a real database (see application-postgres.properties).
# ============================================================
spring.datasource.url=jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ============================================================
# JWT (RS256, asymmetric)
# auth-service is the SOLE issuer: it signs with the private key.
# Verifier services receive only the public key.
# Dev keys live under resources/keys/. In production override
# these to mounted secrets and never ship the private key.
# ============================================================
jwt.private-key=${JWT_PRIVATE_KEY:classpath:keys/jwt-private.pem}
jwt.public-key=${JWT_PUBLIC_KEY:classpath:keys/jwt-public.pem}
jwt.expiration=${JWT_EXPIRATION:86400000}
